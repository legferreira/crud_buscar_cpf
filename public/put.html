<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD - Atualizar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="post.html">Cadastrar</a>
        <a href="get.html">Listar</a>
        <a href="put.html">Atualizar</a>
        <a href="delete.html">Deletar</a>
    </nav>

    <h1>Atualizar</h1>
    <form>
        <label>CPF:</label>
        <input type="text" id="cpf" placeholder="Digite o CPF para busca">
        <input type="button" onclick="buscarDados()" value="Buscar">
        <label>ID:</label>
        <input type="text" id="id" readonly>
        <label>Nome:</label>
        <input type="text" id="nome">
        <label>Sobrenome:</label>
        <input type="text" id="sobrenome">
        <label>Email:</label>
        <input type="text" id="email">
        <label>Idade:</label>
        <input type="text" id="idade">
        <label>Telefone:</label>
        <input type="text" id="telefone">
        <label>Rua:</label>
        <input type="text" id="rua">
        <label>Bairro:</label>
        <input type="text" id="bairro">
        <label>Cidade:</label>
        <input type="text" id="cidade">
        <label>Estado:</label>
        <input type="text" id="estado">
        <label>RG:</label>
        <input type="text" id="rg">
        <input type="button" onclick="atualizarDados()" value="Atualizar">
    </form>

    <script src="put/put.js"></script>
</body>
</html>
